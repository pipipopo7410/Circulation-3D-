name: Deploy circulation 3D (latest version ZIP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Circulation-3D-v*-GitHub-Pages.zip'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: circulation-3d-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Extract latest complete website and verify every file
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find . -maxdepth 1 -type f -name 'Circulation-3D-v*-GitHub-Pages.zip' -printf '%f\n' | sort -V | tail -n1)"
          if [ -z "$FILE" ]; then echo 'No site ZIP found'; exit 1; fi
          echo "Selected: $FILE"
          mkdir -p _site
          python3 -m zipfile -e "$FILE" _site
          SITE_ZIP="$FILE" python3 - <<'PY'
          import os,re,json,hashlib
          from pathlib import Path
          name=os.environ['SITE_ZIP']
          match=re.fullmatch(r'Circulation-3D-v(\d+)\.(\d+)-GitHub-Pages\.zip',name)
          if not match:raise SystemExit('Invalid site ZIP filename: '+name)
          expected=f'V{int(match[1])}.{int(match[2]):02d}'
          root=Path('_site')
          manifest=json.loads((root/'asset-manifest.json').read_text(encoding='utf-8'))
          if manifest.get('version')!=expected:raise SystemExit(f'Wrong version: {manifest.get("version")} vs {expected}')
          files=manifest.get('files',{})
          if len(files)<39:raise SystemExit(f'Manifest unexpectedly small: {len(files)}')
          for relative,meta in files.items():
              path=root/relative
              if not path.is_file():raise SystemExit('Missing '+relative)
              b=path.read_bytes()
              if len(b)!=meta['bytes'] or hashlib.sha256(b).hexdigest()!=meta['sha256']:
                  raise SystemExit('Mismatch '+relative)
          critical=['index.html','js/viewer.js','js/body-context.mjs','models/arteries-core-only.glb','models/veins-core-only.glb',
                    'models/arteries-main-extra.glb','models/veins-main-extra.glb','models/arteries-fine-extra.glb','models/veins-fine-extra.glb',
                    'vendor/three/build/three.module.js','vendor/three/examples/jsm/libs/draco/draco_decoder.wasm']
          for relative in critical:
              if not (root/relative).is_file():raise SystemExit('Missing critical file '+relative)
          print(f'PASS {expected} / {len(files)} assets / 6 GLBs / Three.js / Draco')
          PY
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
